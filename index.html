<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #error { color: #fff; font-family: sans-serif; padding: 20px; display: none; }
  </style>
</head>
<body>
  <div id="error">No video ID provided.</div>
  <script>
    const params = new URLSearchParams(location.search);
    const v = params.get("v");
    const start = params.get("start") || "";
    const autoplay = params.get("autoplay") || "0";

    if (!v) {
      document.getElementById("error").style.display = "block";
    } else {
      const src = new URL(`https://www.youtube-nocookie.com/embed/${v}`);
      src.searchParams.set("autoplay", autoplay);
      if (start) src.searchParams.set("start", start);

      const iframe = document.createElement("iframe");
      iframe.src = src.toString();
      iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
      iframe.setAttribute("allowfullscreen", "");
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
      document.body.appendChild(iframe);
    }
  </script>
</body>
</html>
